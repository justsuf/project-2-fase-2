<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactieve Schoolplaat</title>

  <link rel="stylesheet" href="../assets/css/schoolplaat.css">
</head>
<body>

  <div id="plaat-wrapper">
    <div id="plaat-container">
      
      <img 
        id="plaat-img" 
        src="../assets/images/grafheuvels.jpg" 
        alt="Grafheuvels"
      />

      <div class="vergrootglas" 
           style="top: 47%; left: 41%;" 
           data-info="Stoomkuilen
           Tijdens het ritueel tonen de vier stoomkuilen verschillende scènes:
           een actieve kuil met stoom die richting de grafheuvel waait; een moeder en haar zoontje bij het blussen van stenen; een jongen die een hete steen brengt om te helpen;
           en een meisje dat in stilte afscheid neemt met een barnstenen aandenken.
           Verder beheert een man het vuur bij een haard waar stenen en aardewerk worden verhit, terwijl een buurvrouw met een pot water wacht om te helpen blussen."
           data-link="/pages/storylines/storyline3.html">🔍</div>

      <div class="vergrootglas" 
           style="top: 15%; left: 52%;" 
           data-info="Dieren
            Om te voorkomen dat de open heide tot een jong loofbos groeit liep er regelmatig vee rond. In dit geval heb ik ervoor gekozen om schapen in de verte af te beelden.
            Deze hebben weer een link met de herder (tweeling) op de middengrond, die even de tijd nam om bij het ritueel te zijn.
            Op het pad van heuvel 2 naar heuvel 1 lopen twee mensen. De vrouw heeft water meegenomen en de man naast haar heeft brandhout meegenomen voor het vuur.
            Tenslotte is de plek waar de plaggen net zijn afgestoken te zien achter de “wachter”, zodat er ook hier continuïteit in verhaallijn zit."
           data-link= "/pages/storylines/storyline1.html">🔍</div>

      <div class="vergrootglas" 
           style="top: 32%; left: 78%;" 
           data-info="Het grafritueel 

          Tijdens een begrafenisritueel legt de weduwe verkoold hout in het graf,
          terwijl een belangrijke vrouw een toespraak houdt.

          Rondom de grafheuvel staan familie en kennissen: sommigen rouwen en troosten elkaar,
           anderen kijken nieuwsgierig toe of brengen giften. Ontdek wwaarom ze dit doen en wat er precies gebeurt."
           data-link="/pages/storylines/storyline4.html">🔍</div>

                 <div class="vergrootglas" 
           style="top: 45%; left: 10%;" 
                     data-info="Kleding
                     Hoe liep iemand er in de bronstijd eigenlijk bij? Ontdek gewaden, riemen en sieraden uit een lang vergane tijd en stel zelf een outfit samen als een echte stijlexpert uit de prehistorie!"
           data-link="/pages/storylines/storyline2.html">🔍
        </div>
    </div>
  </div>

  
  <div id="popup" class="popup">
    <button id="popup-close">✖</button>
    <div id="popup-content"></div>
    <button id="popup-button">Ga naar verhaal</button>
  </div>

  <script src="../js/schoolplaat.js"></script>

</body>
</html>
